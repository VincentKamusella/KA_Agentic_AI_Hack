schemaVersion: v0.4
prepare:
  steps:
    - name: Prepare Django application
      command: bash scripts/prepare.sh
test:
  steps:
    - name: Check application
      command: bash scripts/check.sh
run:
  django:
    replicas: 1
    network:
      ports:
        - port: 3000
          isPublic: false
      paths:
        - path: /
          port: 3000
          stripPath: false
    volumeMounts:
      - name: _workspace
        mountPath: /home/user/app
        workspacePath: ""
    steps:
      - name: Run Django with Gunicorn
        command: bash scripts/start.sh
  worker:
    replicas: 2
    network:
      ports:
        - port: 3000
          isPublic: false
      paths: []
    volumeMounts:
      - name: _workspace
        mountPath: /home/user/app
        workspacePath: ""
    steps:
      - name: Run research worker
        command: bash scripts/worker.sh
