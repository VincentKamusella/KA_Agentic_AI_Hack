schemaVersion: v0.5
prepare:
  steps:
    - name: Prepare Django application
      command: bash scripts/prepare.sh
test:
  steps:
    - name: Check application
      command: bash scripts/deploy-check.sh
run:
  web:
    plan: 8
    replicas: 1
    healthEndpoint: http://localhost:3000/health/
    network:
      ports:
        - 3000
      landscapeGateway:
        httpPort: 3000
    volumeMounts:
      - name: _workspace
        mountPath: /home/user/app
        workspacePath: ""
    steps:
      - name: Run Django with Gunicorn
        command: bash scripts/start.sh
  worker:
    plan: 8
    replicas: 2
    healthEndpoint: http://localhost:3000/health/
    network:
      ports:
        - 3000
    volumeMounts:
      - name: _workspace
        mountPath: /home/user/app
        workspacePath: ""
    steps:
      - name: Run research worker
        command: bash scripts/worker.sh
