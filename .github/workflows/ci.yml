name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quotepilot
          POSTGRES_USER: quotepilot
          POSTGRES_PASSWORD: quotepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quotepilot -d quotepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://quotepilot:quotepilot@127.0.0.1:5432/quotepilot
      DJANGO_SECRET_KEY: ci-only-secret-not-for-deployment
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SSL_REDIRECT: "false"
      UV_CACHE_DIR: ${{ github.workspace }}/.codesphere/uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.codesphere/python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Apply migrations to CI database
        run: uv run --locked --no-dev python -m web.manage migrate --noinput
      - name: Check Django, migrations, and backend tests
        run: bash scripts/check.sh
      - name: Check static asset collection
        run: uv run --locked --no-dev python -m web.manage collectstatic --noinput

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting and JavaScript syntax
        run: npm run check
      - name: Run UI tests
        run: npm test
      - name: Build and verify committed vendor assets
        run: |
          npm run build
          git diff --exit-code -- web/static/vendor/bootstrap

  deploy:
    name: Deploy to Codesphere
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CODESPHERE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: codesphere
    concurrency:
      group: codesphere-production
      cancel-in-progress: false
    env:
      CODESPHERE_API_TOKEN: ${{ secrets.CODESPHERE_API_TOKEN }}
      CODESPHERE_WORKSPACE_ID: ${{ vars.CODESPHERE_WORKSPACE_ID }}
      CODESPHERE_API_URL: ${{ vars.CODESPHERE_API_URL }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install verified Codesphere CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/codesphere-cloud/cs-go/releases/download/v1.66.0/cs_1.66.0_linux_amd64 \
            --output "$RUNNER_TEMP/cs"
          echo "e13236c4f7abaca7f11621ed20bf35912d61807b64e137277edb55d6c0cb7611  $RUNNER_TEMP/cs" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cs"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Deploy tested commit and verify services
        run: python3 scripts/deploy_codesphere.py
